<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمودارهای آزمایش فیزیک - آونگ ساده و قانون هوک</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tahoma', 'Arial', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      color: #1e293b;
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #1e3a8a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }
    footer {
      text-align: center;
      margin-top: 2rem;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>نمودارهای آزمایش فیزیک</h1>
    <p class="subtitle">آزمایش آونگ ساده و قانون هوک (فنرها)</p>

    <div class="card">
      <h2>۱. آزمایش آونگ ساده</h2>
      <img src="pendulum_plots.png" alt="نمودارهای آونگ ساده">
    </div>

    <div class="card">
      <h2>۲. آزمایش قانون هوک (فنرها)</h2>
      <img src="hooke_plots.png" alt="نمودارهای قانون هوک">
    </div>

    <footer>
      ساخته‌شده برای گزارش آزمایشگاه فیزیک
    </footer>
  </div>
</body>
</html>
